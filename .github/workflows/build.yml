name: Build

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: 17

      - uses: android-actions/setup-android@v3
        with:
          packages: "platform-tools"  # AGP downloads the compile SDK it needs

      - uses: gradle/actions/setup-gradle@v4

      - name: Build and test
        run: |
          set -o pipefail
          ./gradlew --no-daemon assembleDebug assembleRelease testDebugUnitTest 2>&1 | tee build.log

      - name: Check release APK keeps reflection targets
        run: |
          # R8 must not strip classes and constructors that are created by
          # reflection at startup; a missing one crashes the release build.
          APK=$(ls app/build/outputs/apk/release/*.apk | head -1)
          DEXDUMP=$(ls -d "$ANDROID_HOME"/build-tools/*/ | sort -V | tail -1)dexdump
          mkdir -p dex && unzip -q -o "$APK" 'classes*.dex' -d dex
          for d in dex/*.dex; do "$DEXDUMP" "$d"; done > dex.txt
          missing=""
          for cls in androidx/work/impl/WorkDatabase_Impl app/distillery/stt/engine/ModelDownloadWorker; do
            awk -v c="L$cls;" '
              $0 ~ "Class descriptor" && index($0, c) {inside=1; next}
              $0 ~ "Class descriptor" {inside=0}
              inside && /name *: .<init>./ {found=1}
              END {exit !found}' dex.txt || missing="$missing $cls"
          done
          if [ -n "$missing" ]; then
            echo "::error title=Release build broken::R8 removed constructors needed at runtime:$missing"; exit 1
          fi
          echo "Reflection targets kept."

      - name: Check text to speech stays out of releases
        run: |
          # Text to speech is dev-only until every file it downloads has a
          # confirmed open-source license. The release APK must not contain
          # the engine's classes, manifest entries or license notes.
          APK=$(ls app/build/outputs/apk/release/*.apk | head -1)
          AAPT2=$(ls -d "$ANDROID_HOME"/build-tools/*/ | sort -V | tail -1)aapt2
          found=""
          grep -q 'Lapp/distillery/stt/tts/' dex.txt && found="$found classes"
          "$AAPT2" dump xmltree --file AndroidManifest.xml "$APK" | grep -q 'TTS_SERVICE\|CHECK_TTS_DATA' && found="$found manifest"
          unzip -l "$APK" | grep -q 'Moonshine-G2P-en-unconfirmed\|tts_engine' && found="$found files"
          if [ -n "$found" ]; then
            echo "::error title=Text to speech in release::The release APK contains text-to-speech parts:$found"; exit 1
          fi
          # And the dev build must have it, so the check above means something.
          DEBUG_APK=$(ls app/build/outputs/apk/debug/*.apk | head -1)
          "$AAPT2" dump xmltree --file AndroidManifest.xml "$DEBUG_APK" | grep -q 'TTS_SERVICE' \
            || { echo "::error title=Dev build::The dev build has no text-to-speech engine"; exit 1; }
          # The dev build must carry the stock ONNX Runtime (the TTS models
          # need operators Moonshine's cut-down build lacks); the release keeps
          # Moonshine's own. Packaging may strip the libraries, so compare the
          # two APKs with each other rather than with the downloaded file.
          dev_ort=$(unzip -p "$DEBUG_APK" lib/arm64-v8a/libonnxruntime.so | wc -c)
          rel_ort=$(unzip -p "$APK" lib/arm64-v8a/libonnxruntime.so | wc -c)
          echo "ONNX Runtime: dev $dev_ort bytes, release $rel_ort bytes"
          [ "$dev_ort" -gt $((rel_ort + 2000000)) ] \
            || { echo "::error title=Dev build::The dev APK doesn't carry the full ONNX Runtime (dev $dev_ort, release $rel_ort bytes)"; exit 1; }
          # The dev build's pronunciation data must be in the APK under the names
          # the code opens (the build renames *.gz assets, which once broke this).
          for f in lexicon-us.tsv.gzip lexicon-gb.tsv.gzip heteronyms-us.tsv.gzip heteronyms-gb.tsv.gzip pos-tagger.tsv.gzip pronunciations.tsv; do
            unzip -l "$DEBUG_APK" | grep -q "assets/tts/$f\$" \
              || { echo "::error title=Dev build::assets/tts/$f is missing from the dev APK"; exit 1; }
          done
          echo "Release has no text to speech; dev build has it, with the full ONNX Runtime."

      - name: Report build errors
        if: failure()
        run: |
          # Compiler errors and Gradle's failure summary, as one annotation.
          { grep -E '^e: ' build.log | head -100
            awk '/What went wrong/{on=1} /^\* Try:/{on=0} on' build.log | head -80; } \
            | sed 's/%/%25/g' | awk 'BEGIN{ORS="%0A"} {print}' > errors.txt || true
          echo "::error title=Gradle build failed::$(cat errors.txt)"

      - name: Upload APK
        if: success()
        uses: actions/upload-artifact@v4
        with:
          name: distillery-debug
          path: app/build/outputs/apk/debug/*.apk

      - name: Upload test reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: test-reports
          path: app/build/reports/tests/
