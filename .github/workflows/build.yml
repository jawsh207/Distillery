name: Build

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: 17

      - uses: android-actions/setup-android@v3
        with:
          packages: "platform-tools"  # AGP downloads the compile SDK it needs

      - uses: gradle/actions/setup-gradle@v4

      - name: Build and test
        run: |
          set -o pipefail
          ./gradlew --no-daemon assembleDebug testDebugUnitTest 2>&1 | tee build.log

      - name: Report build errors
        if: failure()
        run: |
          # Compiler errors and Gradle's failure summary, as one annotation.
          { grep -E '^e: ' build.log | head -100
            awk '/What went wrong/{on=1} /^\* Try:/{on=0} on' build.log | head -80; } \
            | sed 's/%/%25/g' | awk 'BEGIN{ORS="%0A"} {print}' > errors.txt || true
          echo "::error title=Gradle build failed::$(cat errors.txt)"

      - name: Upload APK
        if: success()
        uses: actions/upload-artifact@v4
        with:
          name: distillery-debug
          path: app/build/outputs/apk/debug/*.apk

      - name: Upload test reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: test-reports
          path: app/build/reports/tests/
