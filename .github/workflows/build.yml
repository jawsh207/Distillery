name: Build

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: 17

      - uses: android-actions/setup-android@v3
        with:
          packages: "platform-tools"  # AGP downloads the compile SDK it needs

      - uses: gradle/actions/setup-gradle@v4

      - name: Build and test
        run: |
          set -o pipefail
          ./gradlew --no-daemon assembleDebug assembleRelease testDebugUnitTest 2>&1 | tee build.log

      - name: Check release APK keeps reflection targets
        run: |
          # R8 must not strip classes and constructors that are created by
          # reflection at startup; a missing one crashes the release build.
          APK=$(ls app/build/outputs/apk/release/*.apk | head -1)
          DEXDUMP=$(ls -d "$ANDROID_HOME"/build-tools/*/ | sort -V | tail -1)dexdump
          mkdir -p dex && unzip -q -o "$APK" 'classes*.dex' -d dex
          for d in dex/*.dex; do "$DEXDUMP" "$d"; done > dex.txt
          missing=""
          for cls in androidx/work/impl/WorkDatabase_Impl app/distillery/stt/engine/ModelDownloadWorker app/distillery/stt/tts/VoiceDownloadWorker; do
            awk -v c="L$cls;" '
              $0 ~ "Class descriptor" && index($0, c) {inside=1; next}
              $0 ~ "Class descriptor" {inside=0}
              inside && /name *: .<init>./ {found=1}
              END {exit !found}' dex.txt || missing="$missing $cls"
          done
          if [ -n "$missing" ]; then
            echo "::error title=Release build broken::R8 removed constructors needed at runtime:$missing"; exit 1
          fi
          echo "Reflection targets kept."

      - name: Check text to speech is in both builds
        run: |
          APK=$(ls app/build/outputs/apk/release/*.apk | head -1)
          DEBUG_APK=$(ls app/build/outputs/apk/debug/*.apk | head -1)
          AAPT2=$(ls -d "$ANDROID_HOME"/build-tools/*/ | sort -V | tail -1)aapt2
          for apk in "$APK" "$DEBUG_APK"; do
            name=$(basename "$apk")
            "$AAPT2" dump xmltree --file AndroidManifest.xml "$apk" | grep -q 'TTS_SERVICE' \
              || { echo "::error title=$name::No text-to-speech engine in the manifest"; exit 1; }
            # Pronunciation data must be in the APK under the names the code
            # opens (the build renames *.gz assets, which once broke this).
            for f in lexicon-us.tsv.gzip lexicon-gb.tsv.gzip heteronyms-us.tsv.gzip heteronyms-gb.tsv.gzip pos-tagger.bin.gzip guesser-us.bin.gzip guesser-gb.bin.gzip pronunciations.tsv standin/dict.tsv standin/g2p-config.json standin/model.ort standin/onnx-config.json; do
              unzip -l "$apk" | grep -q "assets/tts/$f\$" \
                || { echo "::error title=$name::assets/tts/$f is missing"; exit 1; }
            done
            # Kokoro needs the full ONNX Runtime (about 18 MB for arm64), not
            # Moonshine's cut-down one (about 6 MB).
            ort=$(unzip -p "$apk" lib/arm64-v8a/libonnxruntime.so | wc -c)
            echo "$name: ONNX Runtime $ort bytes"
            [ "$ort" -gt 12000000 ] \
              || { echo "::error title=$name::Not the full ONNX Runtime ($ort bytes)"; exit 1; }
          done
          # Releases are arm64-v8a only; dev builds also carry x86_64 for the emulator.
          unzip -l "$APK" | grep -q 'lib/x86_64/' \
            && { echo "::error title=Release build::The release APK contains x86_64 libraries"; exit 1; }
          unzip -l "$APK" | grep -q 'lib/arm64-v8a/' \
            || { echo "::error title=Release build::The release APK has no arm64-v8a libraries"; exit 1; }
          echo "Both builds have text to speech and the full ONNX Runtime."

      - name: Report build errors
        if: failure()
        run: |
          # Compiler errors and Gradle's failure summary, as one annotation.
          { grep -E '^e: ' build.log | head -100
            awk '/What went wrong/{on=1} /^\* Try:/{on=0} on' build.log | head -80; } \
            | sed 's/%/%25/g' | awk 'BEGIN{ORS="%0A"} {print}' > errors.txt || true
          echo "::error title=Gradle build failed::$(cat errors.txt)"

      - name: Upload APK
        if: success()
        uses: actions/upload-artifact@v4
        with:
          name: distillery-debug
          path: app/build/outputs/apk/debug/*.apk

      - name: Upload test reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: test-reports
          path: app/build/reports/tests/
