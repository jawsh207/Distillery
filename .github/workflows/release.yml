name: Release

# Builds a signed release APK and publishes it as a GitHub release tagged
# v<versionName>. Start it by pushing to the `release` branch, by pushing a
# tag such as v0.1.0, or manually from the Actions tab.
on:
  push:
    branches: [release]
    tags: ["v*"]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
        with:
          fetch-depth: 0 # full history, for the list of changes since the last release

      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: 17

      - uses: android-actions/setup-android@v3
        with:
          packages: "platform-tools"

      - uses: gradle/actions/setup-gradle@v4

      - name: Restore signing key
        env:
          KEYSTORE_BASE64: ${{ secrets.RELEASE_KEYSTORE_BASE64 }}
        run: |
          if [ -z "$KEYSTORE_BASE64" ]; then
            echo "::error::RELEASE_KEYSTORE_BASE64 secret is not set"; exit 1
          fi
          echo "$KEYSTORE_BASE64" | base64 -d > "$RUNNER_TEMP/release.jks"
          echo "RELEASE_KEYSTORE_FILE=$RUNNER_TEMP/release.jks" >> "$GITHUB_ENV"

      - name: Build release APK
        env:
          RELEASE_KEYSTORE_PASSWORD: ${{ secrets.RELEASE_KEYSTORE_PASSWORD }}
          RELEASE_KEY_ALIAS: ${{ secrets.RELEASE_KEY_ALIAS }}
          RELEASE_KEY_PASSWORD: ${{ secrets.RELEASE_KEY_PASSWORD }}
        run: |
          set -o pipefail
          ./gradlew --no-daemon assembleRelease 2>&1 | tee build.log

      - name: Report build errors
        if: failure()
        run: |
          { grep -E '^e: ' build.log | head -100
            awk '/What went wrong/{on=1} /^\* Try:/{on=0} on' build.log | head -80; } \
            | sed 's/%/%25/g' | awk 'BEGIN{ORS="%0A"} {print}' > errors.txt || true
          echo "::error title=Gradle build failed::$(cat errors.txt)"

      - name: Check signature
        run: |
          ls -la app/build/outputs/apk/release/
          APK=$(ls app/build/outputs/apk/release/*.apk 2>/dev/null | grep -v unsigned | head -1)
          if [ -z "$APK" ]; then
            echo "::error::No signed APK was produced: $(ls app/build/outputs/apk/release/ | tr '\n' ' ')"; exit 1
          fi
          APKSIGNER=$(ls -d "$ANDROID_HOME"/build-tools/*/ | sort -V | tail -1)apksigner
          if ! OUT=$("$APKSIGNER" verify --print-certs "$APK" 2>&1); then
            echo "::error::apksigner failed: $(echo "$OUT" | tr '\n' ' ')"; exit 1
          fi
          echo "$OUT"
          # Never publish a release without the text-to-speech engine or the
          # full ONNX Runtime it needs.
          AAPT2=$(ls -d "$ANDROID_HOME"/build-tools/*/ | sort -V | tail -1)aapt2
          "$AAPT2" dump xmltree --file AndroidManifest.xml "$APK" | grep -q 'TTS_SERVICE' \
            || { echo "::error title=Release::The release APK has no text-to-speech engine"; exit 1; }
          ort=$(unzip -p "$APK" lib/arm64-v8a/libonnxruntime.so | wc -c)
          [ "$ort" -gt 12000000 ] \
            || { echo "::error title=Release::Not the full ONNX Runtime ($ort bytes)"; exit 1; }
          VERSION=$(grep -m1 'versionName' app/build.gradle.kts | sed -E 's/.*"(.*)".*/\1/')
          cp "$APK" "Distillery-$VERSION.apk"
          echo "APK_NAME=Distillery-$VERSION.apk" >> "$GITHUB_ENV"
          echo "VERSION=$VERSION" >> "$GITHUB_ENV"

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: distillery-release
          path: ${{ env.APK_NAME }}

      - name: Publish GitHub release
        if: github.event_name == 'push'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          TAG="v$VERSION"
          if [ "$GITHUB_REF_TYPE" = tag ] && [ "$GITHUB_REF_NAME" != "$TAG" ]; then
            echo "::error::Tag $GITHUB_REF_NAME doesn't match versionName $VERSION"; exit 1
          fi
          if gh release view "$TAG" >/dev/null 2>&1; then
            echo "::error::Release $TAG already exists. Bump versionCode and versionName first."; exit 1
          fi
          CODE=$(grep -m1 'versionCode' app/build.gradle.kts | grep -oE '[0-9]+')
          SUMMARY="fastlane/metadata/android/en-US/changelogs/$CODE.txt"
          if [ ! -s "$SUMMARY" ]; then
            echo "::error::Missing $SUMMARY. Add a short summary of this release first."; exit 1
          fi

          # Release page: the summary, then every change since the previous release.
          PREV=$(git tag --list 'v*' --sort=-v:refname | grep -vx "$TAG" | head -1)
          RANGE=${PREV:+$PREV..}$GITHUB_SHA
          {
            echo "## What's new"
            echo
            cat "$SUMMARY"
            echo
            echo "## Changes"
            echo
            git log --no-merges --reverse --format='- %s' "$RANGE"
            echo
            if [ -n "$PREV" ]; then
              echo "**Full changelog:** https://github.com/$GITHUB_REPOSITORY/compare/$PREV...$TAG"
            fi
          } > release-notes.md
          cat release-notes.md

          gh release create "$TAG" "$APK_NAME" \
            --target "$GITHUB_SHA" \
            --title "Distillery $VERSION" \
            --notes-file release-notes.md
