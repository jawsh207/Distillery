name: Release

# Builds a signed release APK and publishes it as a GitHub release.
# Run it by pushing a tag such as v0.1.0, or manually from the Actions tab.
on:
  push:
    tags: ["v*"]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: 17

      - uses: android-actions/setup-android@v3
        with:
          packages: "platform-tools"

      - uses: gradle/actions/setup-gradle@v4

      - name: Restore signing key
        env:
          KEYSTORE_BASE64: ${{ secrets.RELEASE_KEYSTORE_BASE64 }}
        run: |
          if [ -z "$KEYSTORE_BASE64" ]; then
            echo "::error::RELEASE_KEYSTORE_BASE64 secret is not set"; exit 1
          fi
          echo "$KEYSTORE_BASE64" | base64 -d > "$RUNNER_TEMP/release.jks"
          echo "RELEASE_KEYSTORE_FILE=$RUNNER_TEMP/release.jks" >> "$GITHUB_ENV"

      - name: Build release APK
        env:
          RELEASE_KEYSTORE_PASSWORD: ${{ secrets.RELEASE_KEYSTORE_PASSWORD }}
          RELEASE_KEY_ALIAS: ${{ secrets.RELEASE_KEY_ALIAS }}
          RELEASE_KEY_PASSWORD: ${{ secrets.RELEASE_KEY_PASSWORD }}
        run: |
          set -o pipefail
          ./gradlew --no-daemon assembleRelease 2>&1 | tee build.log

      - name: Report build errors
        if: failure()
        run: |
          { grep -E '^e: ' build.log | head -100
            awk '/What went wrong/{on=1} /^\* Try:/{on=0} on' build.log | head -80; } \
            | sed 's/%/%25/g' | awk 'BEGIN{ORS="%0A"} {print}' > errors.txt || true
          echo "::error title=Gradle build failed::$(cat errors.txt)"

      - name: Check signature
        run: |
          APK=$(ls app/build/outputs/apk/release/*.apk | grep -v unsigned | head -1)
          test -n "$APK" || { echo "::error::No signed APK was produced"; exit 1; }
          "$ANDROID_HOME"/build-tools/*/apksigner verify --print-certs "$APK" | grep -E 'SHA-256|DN'
          VERSION=$(grep -m1 'versionName' app/build.gradle.kts | sed -E 's/.*"(.*)".*/\1/')
          cp "$APK" "Distillery-$VERSION.apk"
          echo "APK_NAME=Distillery-$VERSION.apk" >> "$GITHUB_ENV"
          echo "VERSION=$VERSION" >> "$GITHUB_ENV"

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: distillery-release
          path: ${{ env.APK_NAME }}

      - name: Publish GitHub release
        if: startsWith(github.ref, 'refs/tags/')
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create "$GITHUB_REF_NAME" "$APK_NAME" \
            --title "Distillery $VERSION" \
            --notes-file "fastlane/metadata/android/en-US/changelogs/$(grep -m1 'versionCode' app/build.gradle.kts | grep -oE '[0-9]+').txt"
